function fbStore(){
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth=firebase.auth(), db=firebase.firestore(), FV=firebase.firestore.FieldValue;
  return {
    onAuth:cb=>auth.onAuthStateChanged(cb),
    login:()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()),
    logout:()=>auth.signOut().then(()=>location.reload()),
    watchMember:(uid,cb)=>db.doc('members/'+uid).onSnapshot(s=>cb(s.exists?s.data():null),()=>cb(null)),
    saveMember:(uid,data)=>db.doc('members/'+uid).set(data,{merge:true}),
    watchData(){
      db.doc('colony/main').onSnapshot(s=>{S=s.exists?s.data():null;render()},e=>toast('읽기 권한 없음'));
      db.collection('events').orderBy('ts','desc').limit(400).onSnapshot(q=>{EVENTS=q.docs.map(x=>x.data());render()});
      db.collection('handovers').orderBy('ts','desc').limit(30).onSnapshot(q=>{HANDOVERS=q.docs.map(x=>({id:x.id,...x.data()}));render()});
      if(isAdmin())db.collection('members').onSnapshot(q=>{MEMBERS=q.docs.map(x=>({uid:x.id,...x.data()}));render()});
    },
    async commit(mut,evs){
      const ref=db.doc('colony/main');
      await db.runTransaction(async tx=>{
        const s=await tx.get(ref);const st=clone(s.data());mut(st);tx.set(ref,clone(st));
        evs.forEach(e=>tx.set(db.collection('events').doc(),{...e,ts:FV.serverTimestamp()}));
      });
    },
    async seed(st,evs){
      const b=db.batch();b.set(db.doc('colony/main'),clone(st));
      evs.forEach((e,i)=>b.set(db.collection('events').doc(),{...e,ts:firebase.firestore.Timestamp.fromMillis(d(e.date).getTime()+i)}));
      await b.commit();
    },
    async reset(st,evs){
      for(const col of ['events','handovers']){
        const q=await db.collection(col).get();let b=db.batch(),n=0;
        for(const x of q.docs){b.delete(x.ref);if(++n===400){await b.commit();b=db.batch();n=0}}
        if(n)await b.commit();
      }
      await this.seed(st,evs);
    },
    addHandover:h=>db.collection('handovers').add({...h,ts:FV.serverTimestamp()}),
    updateHandover:(id,p)=>db.doc('handovers/'+id).update(p),
  };
}

function status(c){

function todos(){

    if(c.pups){const [a,b]=WEAN[c.line],p=days(c.pups.born);if(p>=a-7)o.push({id:c.id,t:`${c.id} 새끼 암수 분리 ${md(addD(c.pups.born,a))}~${md(addD(c.pups.born,b))}`})}
    if(c.mate&&days(c.mate.start)>=MATE_DAYS-2)o.push({id:c.id,t:`${c.id} 수컷 빼기 ${md(addD(c.mate.start,MATE_DAYS))}`});

function ntbc(){

/* 당번: 순서표를 두 명씩 끊어서 매주 돌고, 교대는 두 주 사이 사람 맞바꾸기 */

function sched(n=8,shift=0){
  const R=S.roster,k=Math.max(0,Math.floor(days(S.dutyStart)/7))+shift,N=k+n+8;
  const W=[];for(let i=0;i<N;i++)W.push({week:addD(S.dutyStart,i*7),pair:[R[(2*i)%R.length],R[(2*i+1)%R.length]]});
  (S.swaps||[]).forEach(s=>{if(!W[s.i]||!W[s.j])return;const a=W[s.i].pair.indexOf(s.x),b=W[s.j].pair.indexOf(s.y);if(a<0||b<0)return;W[s.i].pair[a]=s.y;W[s.j].pair[b]=s.x;W[s.i].sw=W[s.j].sw=1});
  return W.slice(k,k+n);
}

    const fsum=()=>rows.reduce((a,r)=>a+r.f,0);
    const plan=(st=S)=>{const cc=C(st,id),keep=fsum()===cc.f,Ls=nextLetters(cc.litter,rows.length-(keep?1:0),st).map(L=>`${cc.litter}-${L}`);return{keep,ids:keep?[id,...Ls]:Ls}};
    const chk=()=>{const s=fsum(),p=plan();$$('.mid').forEach((e,i)=>e.textContent=p.ids[i]);$('#msum').textContent=`♀ ${s} / ${c.f}`+(s<c.f?` · ${c.f-s}마리 ${id}에 남음`:'')};
    const draw=()=>{const ids=plan().ids;
      $('#mrows').innerHTML=rows.map((r,i)=>`<div class="row"><b class="mid">${ids[i]}</b><label>♀ <input type="number" min="1" value="${r.f}" data-i="${i}" class="mf"></label><label>× ♂ <input type="number" min="1" value="${r.n}" data-i="${i}" class="mn"></label><select data-i="${i}" class="ms" aria-label="수컷 cage">${ms.map(x=>`<option value="${x.id}" ${x.id===r.src?'selected':''}>${cl(x)}</option>`).join('')}</select></div>`).join('');
      $$('.mf').forEach(e=>e.oninput=()=>{rows[e.dataset.i].f=+e.value||0;chk()});
      $$('.mn').forEach(e=>e.oninput=()=>rows[e.dataset.i].n=+e.value||0);
      $$('.ms').forEach(e=>e.onchange=()=>rows[e.dataset.i].src=e.value);chk()};
    F.innerHTML=`<div class="frm"><div id="mrows" style="display:flex;flex-direction:column;gap:6px"></div><div class="row">${c.f>1?'<button class="btn" id="mAdd">+ 메이팅 cage</button>':''}<span id="msum" class="dim"></span></div><div class="row"><button class="btn pri" id="fOk">저장</button></div></div>`;
    draw();
    if(c.f>1)$('#mAdd').onclick=()=>{if(fsum()>=c.f)return;rows.push({f:1,src:rows[rows.length-1].src,n:1});draw()};
    $('#fOk').onclick=async()=>{
      if(fsum()<1||fsum()>c.f){$('#msum').textContent=`♀는 1~${c.f}마리`;return}
      const need={};rows.forEach(r=>need[r.src]=(need[r.src]||0)+r.n);
      if(Object.entries(need).some(([sid,n])=>S.cages.find(x=>x.id===sid).m<n)){$('#msum').textContent='수컷 수 부족';return}
      const P=plan(),R=clone(rows);
      const evs=R.map((r,i)=>{const s=S.cages.find(x=>x.id===r.src);return{cage:P.ids[i],type:'메이팅',text:`♂${r.n} from ${s.id} (DOB ${dobS(s)}) × ♀${r.f} from ${id} (DOB ${dobS(c)})`}});
      after(await commit(st=>{const cc=C(st,id),p=plan(st);if(!p.keep)cc.f-=R.reduce((a,r)=>a+r.f,0);
        R.forEach((r,i)=>{let t=cc;if(p.ids[i]!==id){t={id:p.ids[i],line:cc.line,litter:cc.litter,m:0,f:0,pups:null,mate:null,wait:null,dad:null,note:''};st.cages.push(t)}
          const s=C(st,r.src);if(s.m<r.n)throw new Error('수컷 수 부족');s.m-=r.n;t.f=r.f;t.m+=r.n;t.mate={from:s.id,n:r.n,start:todayS()};t.wait=null;t.dad=s.litter});
      },evs));
    };
    return;
  }
  if(a==='mateEnd'){
    h=`<div>♂${c.mate.n} → ${c.mate.from}</div>`;
    ok=async()=>after(await commit(st=>{const c=C(st,id),s=C(st,c.mate.from);c.m-=c.mate.n;s.m+=c.mate.n;c.wait=c.mate.start;c.dad=s.litter;c.mate=null},
      [{cage:id,type:'수컷 빼기',text:`♂${c.mate.n} → ${c.mate.from}`}]));
  }
  if(a==='noBirth'){h='<div>출산 대기 해제</div>';ok=async()=>after(await commit(st=>{C(st,id).wait=null},[{cage:id,type:'출산 없음',text:''}]))}
  if(a==='birth'){
    const no=nextNo(c.line);
    h=`<div class="row">${num('fP','새끼')}<span>→ ${c.line} ${no}</span></div>`;
    ok=async()=>{const n=v('fP');if(!n)return;
      after(await commit(st=>{const c=C(st,id),no=nextNo(c.line,st);if(c.mate){const s=st.cages.find(x=>x.id===c.mate.from);if(s)c.dad=s.litter}
        st.litters.push({key:`${c.line} ${no}`,line:c.line,no:String(no),dob:todayS(),mom:c.litter,dad:c.dad||null,ended:false});
        c.pups={litter:`${c.line} ${no}`,n,born:todayS()};c.wait=null},[{cage:id,type:'출산',text:`${n} → ${c.line} ${no}`}]))};
  }
  if(a==='wean'){
    const k=c.pups.litter;let rows=[{sx:'♂',n:0},{sx:'♀',n:0}];
    const draw=()=>{const Ls=nextLetters(k,rows.length);
      $('#wrows').innerHTML=rows.map((r,i)=>`<b>${k}-${Ls[i]}</b><select data-i="${i}" class="wsx" aria-label="성별"><option ${r.sx==='♂'?'selected':''}>♂</option><option ${r.sx==='♀'?'selected':''}>♀</option></select><input type="number" min="0" value="${r.n}" data-i="${i}" class="wn" aria-label="마리수">`).join('');
      const upd=()=>{const s=rows.reduce((a,r)=>a+r.n,0);$('#wsum').textContent=`${s} / ${c.pups.n}마리`+(s<c.pups.n?` · ${c.pups.n-s} 남음`:'')};
      $$('.wsx').forEach(e=>e.onchange=()=>{rows[e.dataset.i].sx=e.value});
      $$('.wn').forEach(e=>e.oninput=()=>{rows[e.dataset.i].n=+e.value||0;upd()});upd()};
    F.innerHTML=`<div class="frm"><div class="wr" id="wrows"></div><div class="row"><button class="btn" id="wAdd">+ cage</button><span id="wsum" class="dim"></span></div><label><input type="checkbox" id="fL"> LMO 작성 완료</label><div class="row"><button class="btn pri" id="fOk">저장</button></div></div>`;
    draw();$('#wAdd').onclick=()=>{rows.push({sx:'♀',n:0});draw()};
    $('#fOk').onclick=async()=>{const R=rows.filter(r=>r.n>0);if(!R.length)return;
      if(R.reduce((a,r)=>a+r.n,0)>c.pups.n){$('#wsum').textContent='새끼 수보다 많음';return}
      const Ls=nextLetters(k,rows.length),lmo=$('#fL').checked;
      const text=rows.map((r,i)=>r.n?`${k}-${Ls[i]} ${r.sx}${r.n}`:'').filter(Boolean).join(' / ')+(lmo?' · LMO 작성 완료':'');
      after(await commit(st=>{const c=C(st,id);const Ls=nextLetters(k,rows.length,st);
        rows.forEach((r,i)=>{if(!r.n)return;st.cages.push({id:`${k}-${Ls[i]}`,line:c.line,litter:k,m:r.sx==='♂'?r.n:0,f:r.sx==='♀'?r.n:0,pups:null,mate:null,wait:null,dad:null,note:''})});
        const left=c.pups.n-rows.reduce((a,r)=>a+r.n,0);c.pups=left>0?{...c.pups,n:left}:null},[{cage:id,type:'새끼 암수 분리',text}]))};
    return;
  }
  if(a==='move'){
    const ts=S.cages.filter(x=>x.line===c.line&&x.id!==c.id);
    h=`<div class="row">${c.m?num('fM','♂'):''}${c.f?num('fF','♀'):''}<label>→ <select id="fT">${ts.map(x=>`<option value="${x.id}">${cl(x)}</option>`).join('')}</select></label></div>`;
    ok=async()=>{const t=$('#fT').value,m=v('fM'),f=v('fF');if(!m&&!f)return;
      after(await commit(st=>{const c=C(st,id),T=C(st,t),mm=Math.min(m,c.m),ff=Math.min(f,c.f);c.m-=mm;c.f-=ff;T.m+=mm;T.f+=ff},[{cage:id,type:'이동',text:`♂${m} ♀${f} → ${t}`}]))};
  }
  if(a==='census'){
    h=`<div class="row">${num('fM','♂',c.m)}${num('fF','♀',c.f)}${c.pups?num('fP','새끼',c.pups.n):''}</div><input id="fMemo" placeholder="메모">`;
    ok=async()=>{const m=v('fM'),f=v('fF'),p=v('fP'),memo=$('#fMemo').value;
      after(await commit(st=>{const c=C(st,id);c.m=m;c.f=f;if(c.pups){c.pups.n=p;if(!p)c.pups=null}},[{cage:id,type:'실사',text:`♂${c.m}♀${c.f} → ♂${m}♀${f} ${memo}`.trim()}]))};
  }
  F.innerHTML=`<div class="frm">${h}<div class="row"><button class="btn pri" id="fOk">저장</button></div></div>`;
  $('#fOk').onclick=ok;
}
function ntbcForm(){
  const N=ntbc();
  $('#dT').textContent='NTBC 교체';
  $('#dB').innerHTML=`<div class="frm"><div class="dim">물병당 0.3 ml · vial 1.8 ml · 여유 1 vial 포함</div>
   <div>전체 ${N.all} cage → <b>${N.va} vial</b><br>4마리↑·출산 ${N.big} cage → <b>${N.vb} vial</b></div>
   <div class="row"><input type="date" id="nD" value="${todayS()}" aria-label="날짜"><select id="nS" aria-label="범위"><option>전체</option><option>4마리↑</option></select><button class="btn pri" id="nOk">저장</button></div></div>`;
  $('#nOk').onclick=async()=>{const date=$('#nD').value,scope=$('#nS').value;
    if(await commit(st=>{st.ntbcLog=[...(st.ntbcLog||[]),{date,scope,by:ME.nick}].slice(-40)},[{cage:'전체',type:'NTBC',text:scope}]))$('#dlg').close()};
  $('#dlg').showModal();
}
function swapForm(){
  const W=sched(8),k=Math.max(0,Math.floor(days(S.dutyStart)/7));
  const wk=(id,sel)=>`<select id="${id}" aria-label="주">${W.map((w,i)=>`<option value="${i}" ${i===sel?'selected':''}>${rng(w)} · ${w.pair.join(' · ')}</option>`).join('')}</select>`;
  const who=(id,i)=>`<select id="${id}" aria-label="사람"><option value="*">둘 다</option>${W[i].pair.map(p=>`<option>${p}</option>`).join('')}</select>`;
  $('#dT').textContent='교대';
  $('#dB').innerHTML=`<div class="frm">
   <div class="row">${wk('wA',0)}<span id="pA">${who('xA',0)}</span></div>
   <div class="row">↔ ${wk('wB',1)}<span id="pB">${who('xB',1)}</span></div>
   <div class="row"><button class="btn pri" id="sOk">저장</button></div></div>
   <ul class="tl">${W.map(w=>`<li><span class="dim">${rng(w)}</span> ${w.pair.join(' · ')}${w.sw?' <span class="dim">교대</span>':''}</li>`).join('')}</ul>`;
  $('#wA').onchange=()=>{$('#pA').innerHTML=who('xA',+$('#wA').value)};
  $('#wB').onchange=()=>{$('#pB').innerHTML=who('xB',+$('#wB').value)};
  $('#sOk').onclick=async()=>{const a=+$('#wA').value,b=+$('#wB').value;if(a===b)return;
    const pa=W[a].pair,pb=W[b].pair,xa=$('#xA').value,xb=$('#xB').value;
    const list=xa==='*'||xb==='*'?[[pa[0],pb[0]],[pa[1],pb[1]]]:[[xa,xb]];
    if(await commit(st=>{st.swaps=[...(st.swaps||[]),...list.map(([x,y])=>({i:k+a,j:k+b,x,y}))]},[{cage:'당번',type:'교대',text:`${md(W[a].week)} ${list.map(p=>p[0]).join('·')} ↔ ${md(W[b].week)} ${list.map(p=>p[1]).join('·')}`}]))swapForm()};
  if(!$('#dlg').open)$('#dlg').showModal();
}
function exportXlsx(){
  if(typeof XLSX==='undefined'){toast('엑셀 모듈 로딩 실패');return}
  const wb=XLSX.utils.book_new();
  const cages=S.cages.filter(c=>total(c)>0||c.mate||c.wait).map(c=>({Cage:c.id,Line:c.line,Litter:c.litter,DOB:lit(c.litter).dob,'♂':c.m,'♀':c.f,'새끼':c.pups?c.pups.n:0,'상태':status(c)?.t||'','메이팅':pairS(c),'메모':c.note||''}));
  const lits=S.litters.map(l=>{const cs=S.cages.filter(c=>c.litter===l.key);return{Litter:l.key,DOB:l.dob,'엄마':l.mom,'아빠':l.dad||'','♂':cs.reduce((a,c)=>a+c.m,0),'♀':cs.reduce((a,c)=>a+c.f,0)}});
  const ev=EVENTS.map(e=>({Date:e.date,Cage:e.cage,'구분':e.type,'내용':e.text,'입력':e.by}));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(cages),'Cages');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(lits),'Litters');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ev),'Events');
  XLSX.writeFile(wb,`STAR Mouse ${todayS()}.xlsx`);
}
function profileForm(first){
  const names=[...(S?.roster||['예원','도윤','소윤','한결','유진','재혁','혜민']),'교수님','기타'];
  $('#dT').textContent=first?'닉네임 정하기':'내 정보';
  $('#dB').innerHTML=`<div class="frm"><div class="dim">${esc(AUTH?.email||'')}</div>
   <label>닉네임 <input id="pN" maxlength="12" value="${first?'':esc(ME?.nick||'')}" placeholder="예: 유진"></label>
   <label>당번표 이름 <select id="pR">${names.map(n=>`<option ${n===ME?.name?'selected':''}>${n}</option>`).join('')}</select></label>
   <div class="row"><button class="btn pri" id="pOk">저장</button>${first?'':'<button class="btn" id="pOut">로그아웃</button>'}</div></div>`;
  $('#pOk').onclick=async()=>{const nick=$('#pN').value.trim();if(!nick){$('#pN').focus();return}
    const data={nick,name:$('#pR').value,email:AUTH.email||''};
    if(!first){try{await Store.saveMember(AUTH.uid,data);$('#dlg').close()}catch(e){toast('저장 실패')}return}
    // 역할은 서버 규칙이 허용하는 것만 저장됨: 미리 등록된 계정이면 바로 승인, 아니면 승인 대기
    for(const role of ['admin','editor','viewer','pending']){
      try{await Store.saveMember(AUTH.uid,{...data,role});$('#dlg').close();return}catch(e){}
    }
    toast('저장 실패');};
  if(!first)$('#pOut').onclick=()=>Store.logout();
  if(!$('#dlg').open)$('#dlg').showModal();
}

/* ===== 시작 ===== */
function show(which){['login','pending','app'].forEach(k=>$('#'+k).hidden=k!==which)}
function go(t){tab=t;$$('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));render()}
$$('#tabs button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
$('#dX').onclick=()=>$('#dlg').close();
$('#meBtn').onclick=()=>profileForm(false);
$('#gIn').onclick=()=>Store.login().catch(e=>toast('로그인 실패'));
$('#pOut2').onclick=()=>Store.logout();
Store.onAuth(u=>{
  if(!u){show('login');return}
  AUTH=u;
  Store.watchMember(u.uid,m=>{
    if(!m){show('login');profileForm(true);return}
    ME={uid:u.uid,...m};
    if(ME.role==='pending'){show('pending');$('#pendMsg').textContent=`${ME.nick} · 유진에게 카톡으로 알려주면 승인해줄 거예요`;return}
    show('app');
    if(!started){started=true;Store.watchData()}
    render();
  });
});
