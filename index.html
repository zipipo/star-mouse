<style>
@font-face{font-family:"NeoHyundai";src:url("fonts/NeoHyundai-R.woff2") format("woff2");font-weight:100 550;font-display:swap}
@font-face{font-family:"NeoHyundai";src:url("fonts/NeoHyundai-B.woff2") format("woff2");font-weight:551 900;font-display:swap}
:root{
  --bg:#ffffff; --fg:#17181c; --sub:#3d414a; --line:rgba(30,34,60,.09); --soft:rgba(255,255,255,.62); --glass:rgba(255,255,255,.78);
  --g1:#ffe3ee; --g2:#ddeeff; --g3:#fff7d6; --g4:#ddf6e3; --g5:#efe4ff; --gbase:#fbfcff;
  --frg:#fff6c9; --fah:#ffe4ec; --blue:#e0edff;
  --acc:#eeebff; --acc-2:#cbc4ff; --acc-ink:#3b3391; --card:rgba(255,255,255,.74);
  --male:#1f4fb8; --female:#c2185b; --pup:#f7b3cb;
  --alert:#ffd0cc; --alert-ink:#c4161c; --new:#e6f7d4; --gen:#f0eedb;
  --font:"NeoHyundai","네오현대","Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#17181c; --fg:#f3f3f5; --sub:#cfd2d9; --line:rgba(255,255,255,.09); --soft:rgba(255,255,255,.06); --glass:rgba(23,24,28,.8);
  --g1:#3a2430; --g2:#1f2c40; --g3:#35321f; --g4:#1f3527; --g5:#2c2440; --gbase:#16171b;
  --frg:#4b4520; --fah:#4d2a36; --blue:#22344f; --acc:#2a2748; --acc-2:#5a51b5; --acc-ink:#e9e6ff; --card:rgba(32,33,40,.72);
  --male:#9cc2ff; --female:#ff9cc6; --pup:#b56d88; --alert:#5a2420; --alert-ink:#ffaaa2; --new:#2d4222; --gen:#3d3b2c; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--gbase);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:40px}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(55% 45% at 8% 6%,var(--g1),transparent 72%),
  radial-gradient(50% 45% at 92% 10%,var(--g2),transparent 72%),
  radial-gradient(55% 50% at 10% 72%,var(--g3),transparent 72%),
  radial-gradient(55% 50% at 62% 88%,var(--g4),transparent 72%),
  radial-gradient(40% 40% at 96% 58%,var(--g1),transparent 72%),
  radial-gradient(45% 40% at 50% 40%,var(--g5),transparent 75%),var(--gbase)}
.wrap{max-width:1180px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc-2);outline-offset:2px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 18px;flex-wrap:wrap}
h1{font-size:19px;margin:0;font-weight:700;display:flex;align-items:center;gap:8px}
.logo{width:30px;height:30px;border-radius:50%}.logo.big{width:72px;height:72px}
select,input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 7px}
.duty{position:relative;background:var(--card);color:var(--fg);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 4px 22px rgba(90,80,170,.08);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.duty::before,.duty::after{content:"";position:absolute;top:-11px;width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:14px solid var(--card)}
.duty::before{left:22px}.duty::after{left:56px}
.duty b{font-size:16px}.duty .s{font-size:13px}
.duty.mini{padding:0}.duty.mini b{font-size:14px}
.duty-mini{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;width:100%;background:none;border:0;font:inherit;font-size:13.5px;color:var(--fg);text-align:left;padding:9px 14px;min-height:44px;cursor:pointer}
.duty-mini .dim{font-size:12.5px}.duty-mini .dm-x{margin-left:auto;color:var(--sub)}
.duty-fold{position:absolute;right:10px;bottom:6px;background:none;border:0;font:inherit;font-size:12px;color:var(--sub);cursor:pointer;padding:4px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:0;background:var(--soft);border-radius:99px;padding:6px 13px;font-size:13px}
.btn.pri{background:var(--acc-2);color:var(--acc-ink);font-weight:700}
.duty .btn{background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}.duty .btn.pri{background:var(--acc-2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.stat{display:flex;flex-direction:column;gap:6px;margin:12px 2px 0;font-size:13.5px;font-variant-numeric:tabular-nums}
.cnt{border-collapse:collapse}.cnt th,.cnt td{padding:4px 16px 4px 0;text-align:left;border-bottom:1px solid var(--line)}.cnt th{font-weight:500;color:var(--sub)}
.todo{margin:10px 0 0;display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.todo button{border:0;text-align:left;background:var(--alert);color:var(--alert-ink);border-radius:10px;padding:7px 11px;font-size:13.5px;font-weight:700}
.pres{display:flex;gap:4px}
.pres span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 4px rgba(40,40,80,.12)}
.card.mating{position:relative;overflow:hidden}
.mt{height:32px;width:auto;vertical-align:middle;margin-left:4px}
.hrt{position:absolute;bottom:-14px;font-size:15px;color:#ff8fb3;opacity:0;animation:hrt 3.6s ease-in infinite;pointer-events:none}
@keyframes hrt{0%{transform:translateY(0) scale(.7);opacity:0}15%{opacity:.9}100%{transform:translateY(-120px) scale(1.15);opacity:0}}
@media (prefers-reduced-motion:reduce){.hrt{display:none}}
.todo.mat button{background:var(--blue);color:var(--fg)}
nav.tabs{display:flex;gap:2px;margin:16px 0 12px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{border:0;background:none;padding:8px 12px;font-size:14px;white-space:nowrap;border-bottom:2px solid transparent}
nav.tabs button[aria-selected="true"]{font-weight:700;border-bottom-color:var(--acc-2)}
nav.tabs button[aria-selected="true"]::before{content:"🐾 "}
.filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}.filters .chip,.filters .btn{white-space:nowrap;flex:none}
.chip{border:0;background:var(--soft);border-radius:99px;padding:4px 12px;font-size:13px}
.chip:disabled{cursor:default;opacity:1}
.chip[aria-pressed="true"]{background:var(--acc-2);color:var(--acc-ink);font-weight:700}
.litter{margin-bottom:14px}
.litter h3{font-size:13.5px;margin:0 0 6px;font-weight:700}
.litter h3 span{font-weight:400;color:var(--sub);margin-left:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{border:0;text-align:left;border-radius:14px;padding:10px 11px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card.FRG{background:var(--frg)}.card.FAH{background:var(--fah)}.card.blue{background:var(--blue)}
.card.wait{background:var(--g5);box-shadow:inset 0 0 0 1.5px var(--acc-2)}
.ctag{align-self:flex-start;font-size:11.5px;font-weight:700;line-height:1.3;padding:1px 8px;border-radius:99px;white-space:nowrap}
.ctag.born{background:#fff;color:#1f4fb8;box-shadow:inset 0 0 0 1px #b9cff5}.ctag.wt{background:#fff;color:var(--acc-ink);box-shadow:inset 0 0 0 1px var(--acc-2)}
@media (prefers-color-scheme:dark){.ctag.born,.ctag.wt{background:var(--bg)}.ctag.born{color:var(--male)}}
.brd{font-size:12px;font-weight:700;color:var(--alert-ink)}
.ntl{font-size:13px;line-height:1.5}.ntl i{font-style:normal;color:var(--sub)}
.wtt{border-collapse:collapse;font-size:13px;white-space:nowrap}.wtt td,.wtt th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:center}.wtt th{font-size:11.5px;color:var(--sub);font-weight:600}.wtt td:first-child{text-align:left}
.wtt small{display:block;font-size:11px;color:var(--sub)}.wtt small.bad{color:var(--alert-ink);font-weight:800}
.wtf input{width:62px;min-height:38px;text-align:center;font-size:15px;padding:0 2px}
.fq .r{display:block;width:100%;text-align:left;background:var(--soft);border:0;border-radius:10px;padding:8px 10px;margin-top:6px;font:inherit;color:inherit;cursor:pointer}
.card .id{font-weight:700;font-size:14.5px}
.card .inj{align-self:flex-start;font-size:11.5px;font-weight:700;line-height:1.3;padding:1px 7px;border-radius:99px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);color:var(--sub);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.card .inj.mid{color:var(--acc-ink)}.card .inj.late{color:var(--alert-ink)}
.card .memo{font-size:12.5px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st{font-size:12.5px;font-weight:700}.st.late{color:var(--alert-ink)}
.mice{font-size:15px;line-height:1.35;word-break:break-all}
.sx{font-size:17px;font-weight:700;display:inline-block;margin-right:4px;vertical-align:-1px}
.ma{color:var(--male);font-weight:700}.fe{color:var(--female);font-weight:700}

.pups{display:flex;flex-wrap:wrap;gap:3px;align-items:center;font-size:12.5px}
.pups i{width:18px;height:18px;background:url(baby.png) center/contain no-repeat;display:inline-block}
.tree ul{list-style:none;margin:0;padding-left:22px;border-left:1px solid var(--line)}
.tree>ul{border-left:0;padding-left:0}
.tree li{position:relative;padding:3px 0}
.tree ul ul li::before{content:"";position:absolute;left:-22px;top:14px;width:16px;border-top:1px solid var(--line)}
.node{display:inline-flex;gap:2px 7px;align-items:center;padding:3px 9px;border-radius:8px;font-size:13px;flex-wrap:wrap;max-width:100%}
.node.FRG{background:var(--frg)}.node.FAH{background:var(--fah)}.node.end{background:var(--soft)}
.log{width:100%;border-collapse:collapse;font-size:13px}
.log td,.log th{padding:6px 8px 6px 0;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.log th{color:var(--sub);font-weight:500}
.ox{overflow-x:auto}
.ho{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ho section{min-width:0}
.ho h4{margin:0 0 4px;font-size:13.5px}
.ho ul{margin:0 0 10px;padding-left:18px}
textarea{width:100%;min-height:60px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
dialog{border:0;border-radius:16px;padding:0;width:min(480px,calc(100vw - 24px));background:var(--bg);color:var(--fg);box-shadow:0 10px 40px rgba(0,0,0,.2)}
dialog::backdrop{background:rgba(0,0,0,.3)}
.dh{padding:14px 16px 6px;display:flex;justify-content:space-between;align-items:center}
.dh h2{margin:0;font-size:17px}
.db{padding:0 16px 16px;max-height:72vh;overflow:auto}
.qa{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;align-items:center}.qa .qg{width:44px;font-size:12px;color:#6b7a5a;font-weight:700}.qa button{flex:0 0 auto;padding:8px 12px!important}.qa.g1 button{background:#fde8f0}.qa.g2 button{background:#eef1f7}.qa.g3 button{background:#eef7e6}.qa button.on{background:var(--acc)!important}
.qa button{border:0;background:var(--soft);border-radius:10px;padding:9px 4px;font-size:13px}
.qa button.on{background:var(--acc);font-weight:700}
.frm{display:flex;flex-direction:column;gap:8px;background:var(--soft);border-radius:12px;padding:10px;margin-bottom:12px}
.frm label{display:flex;gap:8px;align-items:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=number]{width:62px}
.wr{display:grid;grid-template-columns:auto auto 1fr;gap:8px;align-items:center}
.wr b{font-size:13.5px}
.tl{font-size:13px;margin:0;padding-left:16px}
.tl li{margin-bottom:3px}
.dim{color:var(--sub);font-size:12.5px}
.screen{min-height:100vh;display:grid;place-items:center}
.lg{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}.lg h2{margin:0;font-size:20px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:13px;z-index:30}
@media (max-width:640px){.ho{grid-template-columns:1fr}}
details>summary.more .c,details[open]>summary.more .o{display:none}details[open]>summary.more .c{display:inline}summary.more{list-style:none}summary.more::-webkit-details-marker{display:none}
.wl-d{font-weight:700;margin:12px 0 4px;font-size:14px}.wl{padding:6px 10px;border-radius:8px;background:var(--soft);margin:4px 0;font-size:13.5px}.wl-t{font-size:12px;padding:1px 7px;border-radius:9px;background:#fff;color:#5f6e4f;margin-left:2px}.wl-x{color:#6b6b6b;font-size:13px;margin-top:2px;line-height:1.4}
#upd{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:50;border:0;border-radius:20px;padding:8px 16px;background:#d3f08f;color:#2e5206;font-weight:700;box-shadow:0 2px 8px #0002}
.hotop{margin-top:8px;border:1.5px solid var(--acc-2);border-radius:14px;padding:10px 14px;font-size:13.5px}
.hotop .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.hotop .x{white-space:pre-wrap;line-height:1.5}
.warn{background:var(--alert);color:var(--alert-ink);border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.5}
.tip{background:var(--blue);border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.5}
.log td:nth-last-child(-n+2),.log th:nth-last-child(-n+2){white-space:nowrap}
.evx{border:0;background:none;color:var(--sub);font-size:12px;padding:0 4px;text-decoration:underline;cursor:pointer}
.rules h4{margin:14px 0 4px;font-size:14px}.rules ul{margin:0;padding-left:18px}.rules li{margin:2px 0}
.node.mt{display:flex;height:auto;margin-left:0;background:var(--bg);border:1.5px dashed #f2a7c3;cursor:pointer;padding:5px 9px}.node.mt .dim{flex-basis:100%}
@media (max-width:480px){.tree ul{padding-left:14px}.tree ul ul li::before{left:-14px;width:10px}}.node .pp{font-size:12px;background:#fff9;border-radius:6px;padding:0 5px}
/* 오늘 할 일 · 되돌리기 · DOB 라벨 */
#toast{display:flex;align-items:center;gap:10px;width:max-content;max-width:calc(100vw - 24px)}#toast span{flex:1;min-width:0}
#toast button{border:0;border-radius:99px;background:var(--acc-2);color:var(--acc-ink);font-weight:700;font-size:14px;padding:0 16px;min-height:44px;white-space:nowrap;flex:none}
.td{display:flex;flex-direction:column;gap:8px;max-width:640px}
@media (min-width:900px){.td{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;max-width:none}.td>:not(.tdi){grid-column:1/-1}}
.ntb{font-size:13px;color:var(--sub);padding:2px 2px 0}.ntb b{color:var(--fg)}
.tdsec{font-size:14px;font-weight:800;margin:6px 2px 0}.tdsec.late{color:var(--alert-ink)}
.tdi{background:var(--soft);border-radius:12px;padding:9px 11px;display:flex;flex-direction:column;gap:6px;border-left:4px solid var(--acc-2)}
.tdi.late{background:var(--alert);border-left-color:var(--alert-ink)}
.tdi .k{font-size:12px;font-weight:800;color:var(--acc-ink)}.tdi.late .k{color:var(--alert-ink)}
.tdi .row{gap:6px;align-items:center}
.tdi .dim{font-size:12.5px}
.lab{font-size:15.5px;font-weight:800;line-height:1.3}
.big{min-height:38px;border:0;border-radius:10px;padding:0 12px;font-size:14px;font-weight:700;background:var(--bg);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line)}
.big.pri{background:var(--acc-2);color:var(--acc-ink);box-shadow:none}
.big.sq{width:38px;padding:0;font-size:18px}
.big.no{color:var(--alert-ink);box-shadow:inset 0 0 0 1.5px var(--alert-ink)}
.big:disabled{opacity:.45}
.tdi input[type=date],.tdi input.by,.tdi select{min-height:38px;font-size:14px;padding:0 8px}
.tdi input.n{width:48px;min-height:38px;text-align:center;font-size:16px;font-weight:700;padding:0}
.tdi label.ck{width:auto;display:flex;align-items:center;gap:6px;min-height:38px;font-size:13.5px}.tdi label.ck input{width:18px;height:18px}
.tdup{margin-top:6px}.tdup summary{cursor:pointer;font-weight:700;padding:8px 2px}
.tdup button{display:block;width:100%;text-align:left;border:0;background:var(--soft);border-radius:10px;padding:8px 11px;margin:5px 0;font-size:13.5px;min-height:40px}
.card .lab{font-size:16.5px}
.card .cid{font-size:12px;color:var(--sub)}
.bq{width:100%;min-height:44px;font-size:15px;margin-bottom:10px}
.ck{width:100%;border-collapse:collapse;font-size:14px}
.ck td,.ck th{padding:4px 3px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.ck th{font-size:12px;color:var(--sub);font-weight:600;position:sticky;top:46px;background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:1}
.ck td.cd{text-align:left;line-height:1.25}.ck td.cd b{font-size:14px}.ck td.cd>span{display:block;font-size:11.5px;color:var(--sub)}
.ck tr.sec td{text-align:left;font-weight:800;padding:14px 3px 4px;font-size:15px;border-bottom:2px solid var(--fg)}
.ck input{width:46px;min-height:38px;text-align:center;font-size:16px;font-weight:700;padding:0;border-radius:8px;border:1.5px solid var(--line)}
.ck input.m{color:var(--male);border-color:color-mix(in srgb,var(--male) 45%,transparent);background:color-mix(in srgb,var(--male) 8%,var(--bg))}
.ck input.f{color:var(--female);border-color:color-mix(in srgb,var(--female) 45%,transparent);background:color-mix(in srgb,var(--female) 8%,var(--bg))}
.ck input.z{opacity:.45;font-weight:500}
.ck input.p{color:var(--fg)}
.ck th.m{color:var(--male);font-weight:800}.ck th.f{color:var(--female);font-weight:800}
.ck tr.lit td{text-align:left;font-size:12px;color:var(--sub);font-weight:700;padding:10px 3px 2px;border-bottom:0}
.ck td.cd .lab{font-size:14.5px}

.ck tr.y td{background:#e7f5ea}.ck tr.y .ok{background:#3f9a72;color:#fff}
.ck tr.x td{background:var(--alert)}.ck tr.x .ok{background:var(--alert-ink);color:#fff}
.ck input.dif{font-weight:800;color:var(--alert-ink);box-shadow:inset 0 0 0 2px var(--alert-ink)}
.ckh{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;position:sticky;top:0;background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:2;padding:6px 0}
.ckh .n{font-weight:700;font-size:14px;margin-right:auto}
.undone td:nth-child(4){text-decoration:line-through;opacity:.6}
</style>

<div id="login" class="screen" hidden><div class="lg"><img src="icon-192.png" alt="" class="logo big"><h2>STAR Mouse Information</h2><button class="btn pri" id="gIn">Google로 로그인</button></div></div>
<div id="pending" class="screen" hidden><div class="lg"><img src="icon-192.png" alt="" class="logo big"><h2>승인 대기 중</h2><div id="pendMsg"></div><button class="btn" id="pOut2">로그아웃</button></div></div>
<div class="wrap" id="app" hidden>
<header class="top">
  <h1><img src="icon-192.png" alt="" class="logo">STAR Mouse Information</h1>
  <div class="row" style="gap:10px"><div id="pres" class="pres"></div><button class="btn" id="meBtn"></button></div>
</header>

function fbStore(){
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth=firebase.auth(), db=firebase.firestore(), FV=firebase.firestore.FieldValue;
  return {
    onAuth:cb=>auth.onAuthStateChanged(cb),
    login:()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()),
    logout:()=>auth.signOut().then(()=>location.reload()),
    watchMember:(uid,cb)=>db.doc('members/'+uid).onSnapshot(s=>cb(s.exists?s.data():null),()=>cb(null)),
    saveMember:(uid,data)=>db.doc('members/'+uid).set(data,{merge:true}),
    watchData(){
      let bk=0;db.doc('colony/main').onSnapshot(s=>{S=s.exists?s.data():null;render();if(S&&!bk&&canEdit()){bk=1;setTimeout(()=>this.backup(),8000)}},e=>toast('읽기 권한 없음'));
      db.collection('events').orderBy('ts','desc').limit(400).onSnapshot(q=>{EVENTS=sortEv(q.docs.map(x=>({id:x.id,...x.data()})));render()});
      db.collection('handovers').orderBy('ts','desc').limit(30).onSnapshot(q=>{HANDOVERS=q.docs.map(x=>({id:x.id,...x.data()}));render()});
      if(isAdmin())db.collection('members').onSnapshot(q=>{MEMBERS=q.docs.map(x=>({uid:x.id,...x.data()}));render()});
    },
    /* 상태 저장 + 기록. 바뀐 게 있으면 첫 기록에 chg(전후)를 붙이고, 기록이 없으면 '상태 변경' 기록을 만듦. marks: 다른 기록에 표시(되돌림) */
    async commit(mut,evs,marks){
      const ref=db.doc('colony/main');let out=null;
      /* plain: Firestore 규칙이 새 필드(chg·grp·undoOf)를 막으면 그 필드 빼고 한 번 더 (되돌리기만 안 됨) */
      const run=plain=>db.runTransaction(async tx=>{
        const s=await tx.get(ref);const b=s.data()||{},st=clone(b);mut(st);const r=prepEvs(b,st,evs);tx.set(ref,clone(st));
        const refs=r.evs.map(()=>db.collection('events').doc()),grp=refs[0]?refs[0].id:null;
        r.evs.forEach((e,i)=>{const x={...e,grp,ts:FV.serverTimestamp()};if(plain){delete x.chg;delete x.grp;delete x.undoOf}tx.set(refs[i],x)});
        if(!plain)(marks||[]).forEach(m=>tx.update(db.doc('events/'+m.id),m.patch));
        out=plain?{}:{grp,chg:r.chg,ids:refs.map(x=>x.id)};
      });
      try{await run(false)}catch(e){if(!/permission|insufficient/i.test(e.code+' '+e.message))throw e;console.warn('새 필드 없이 다시 저장',e);await run(true)}
      return out;
    },
    /* 기록 한 줄 수정(patch) 또는 삭제(null). mut가 있으면 cage 상태도 같이 바꿈 */
    async editEvent(id,patch,mut,log){
      const ref=db.doc('colony/main'),er=db.doc('events/'+id);
      await db.runTransaction(async tx=>{let st=null,L=log;if(mut){const s=await tx.get(ref);const b=s.data()||{};st=clone(b);mut(st);const r=prepEvs(b,st,log?[log]:[]);L=r.evs[0]||null}
        if(patch===null)tx.delete(er);else tx.update(er,patch);if(mut)tx.set(ref,clone(st));
        if(L)tx.set(db.collection('events').doc(),{...L,ts:FV.serverTimestamp()})});
    },
    log:e=>db.collection('events').add({...e,ts:FV.serverTimestamp()}),
    async purge(E){const n=new Date(),id=`${ymd(n)}-정리-${String(n.getHours()).padStart(2,'0')}${String(n.getMinutes()).padStart(2,'0')}`;
      await db.doc('backups/'+id).set({t:FV.serverTimestamp(),by:ME.nick,purge:true,main:clone(S),events:clone(E.map(e=>({...e,ts:e.ts?.toMillis?.()||null}))),handovers:[]}).catch(e=>console.warn('정리 백업 실패',e));
      for(let i=0;i<E.length;i+=400){const b=db.batch();E.slice(i,i+400).forEach(e=>b.delete(db.doc('events/'+e.id)));await b.commit()}
      await db.collection('events').add({date:todayS(),by:ME.nick,cage:'전체',type:'기록 정리',text:`${E.length}건 지움 · 백업 ${id}`,ts:FV.serverTimestamp()})},
    async seed(st,evs){
      const b=db.batch();b.set(db.doc('colony/main'),clone(st));
      b.set(db.collection('events').doc(),{date:todayS(),by:ME.nick,cage:'전체',type:'초기 데이터',text:`cage ${st.cages.length}개 · litter ${st.litters.length}개로 시작 (기존 데이터 덮어씀)`,ts:FV.serverTimestamp()});
      evs.forEach((e,i)=>b.set(db.collection('events').doc(),{...e,ts:firebase.firestore.Timestamp.fromMillis(d(e.date).getTime()+i)}));
      await b.commit();
    },
    presence(){
      const ref=db.doc('presence/'+AUTH.uid),beat=()=>{if(document.visibilityState==='visible')ref.set({nick:ME.nick,ts:FV.serverTimestamp()}).catch(()=>{})};
      beat();setInterval(beat,30000);document.addEventListener('visibilitychange',beat);
      window.addEventListener('pagehide',()=>{ref.delete().catch(()=>{})});
      db.collection('presence').onSnapshot(q=>{PRES=q.docs.map(x=>({uid:x.id,nick:x.data().nick,t:x.data().ts?.toMillis?.()||Date.now()}));drawPres()},()=>{});
      setInterval(drawPres,30000);
    },
    async backup(){const id=ymd(new Date());
      await db.doc('backups/'+id).set({t:FV.serverTimestamp(),by:ME.nick,main:clone(S),events:clone(EVENTS.map(e=>({...e,ts:e.ts?.toMillis?.()||null}))),handovers:clone(HANDOVERS.map(e=>({...e,ts:e.ts?.toMillis?.()||null})))}).catch(()=>{});
      if(isAdmin()){const old=ymd(new Date(Date.now()-60*864e5));const q=await db.collection('backups').where(firebase.firestore.FieldPath.documentId(),'<',old).get().catch(()=>null);q&&q.docs.forEach(x=>x.ref.delete().catch(()=>{}))}},
    listBackups:async()=>(await db.collection('backups').get()).docs.map(x=>({id:x.id,...x.data()})).sort((a,b)=>b.id.localeCompare(a.id)),
    getReport:async()=>{const x=await db.doc('colony/report').get();return x.exists?x.data():{}},
    saveReport:p=>db.doc('colony/report').set(p,{merge:true}),
    addHandover:h=>db.collection('handovers').add({...h,ts:FV.serverTimestamp()}),
    updateHandover:(id,p)=>db.doc('handovers/'+id).update(p),
    /* 지우기 권한이 없으면 moved 표시로 숨김 */
    deleteHandover:id=>db.doc('handovers/'+id).delete().catch(e=>db.doc('handovers/'+id).update({moved:true})),
  };
}

function evSync(e,nd,st=S){
  const c=st.cages.find(x=>x.id===e.cage);if(!c||nd===e.date)return null;
  if(e.type==='메이팅'&&c.mate&&c.mate.start===e.date)return {lab:'Mating 시작일',f:st=>{C(st,c.id).mate.start=nd}};
  if(e.type==='메이팅'&&c.wait===e.date)return {lab:'Mating 시작일 (출산 예정 계산)',f:st=>{C(st,c.id).wait=nd}};
  if(e.type==='출산'&&c.pups&&c.pups.born===e.date)return {lab:`출산일 · ${c.pups.litter} DOB`,f:st=>{const x=C(st,c.id);x.pups.born=nd;const l=lit(x.pups.litter,st);if(l&&l.dob===e.date)l.dob=nd}};
  return null}

  /* 줄마다 앞 날짜(2026.10.26)만 굵게 */
  const rt=t=>{if(!t)return '';const runs=[];String(t).split('\n').forEach((ln,i)=>{const m=ln.match(/^(\d{4}\.\d{2}\.\d{2})(.*)$/),p=i?'\n':'';
    if(m){runs.push({text:p+m[1],font:{bold:true}});runs.push({text:m[2]})}else runs.push({text:p+ln})});return {richText:runs}};
  // information method
  const im=wb.addWorksheet('information method');im.getColumn(2).width=154;
  LEG_METHOD.forEach((t,i)=>{if(!t)return;const c=im.getCell(4+i,2);c.value=t;c.alignment={wrapText:true,vertical:'middle'};
    if(i===0)c.font={bold:true,size:13};else if(t.startsWith('**'))c.font={bold:true,color:{argb:'FF'+BL}}});
  // 마리수 및 cage수
  const K=[...LINES(),'일반'],cw=wb.addWorksheet('마리수 및 cage수',{views:[{state:'frozen',ySplit:2}]}),nc=2+K.length*2;
  cw.getCell(1,1).value='날짜';cw.mergeCells(1,1,2,1);cw.getColumn(1).width=12;
  K.forEach((k,i)=>{const c=2+i*2;cw.getCell(1,c).value=`${k} mice`;cw.mergeCells(1,c,1,c+1);cw.getCell(2,c).value='마리수';cw.getCell(2,c+1).value='Cage 수';cw.getColumn(c).width=cw.getColumn(c+1).width=9});
  [['총 cage 수',10],['NTBC 교체일',40],['남은 NTBC',11]].forEach(([h,w],i)=>{cw.getCell(1,nc+i).value=h;cw.mergeCells(1,nc+i,2,nc+i);cw.getColumn(nc+i).width=w});
  for(let c=1;c<nc+3;c++)[1,2].forEach(r=>cw.getCell(r,c).value=cw.getCell(r,c).value??'');
  head(cw,[1,2],'EDE7DF');K.forEach((k,i)=>[1,2].forEach(r=>[0,1].forEach(j=>cw.getCell(r,2+i*2+j).fill=FILL(k==='일반'?'E6F0E0':lc(k)))));
  const rows=[...LEG_COUNTS,...(S.countLog||[]).filter(r=>r.date!==now.date&&!LEG_COUNTS.some(x=>x.date===r.date)),now].sort((a,b)=>a.date.localeCompare(b.date));
  rows.forEach((r,j)=>{const R=3+j,row=cw.getRow(R),cells=K.map((k,i)=>String.fromCharCode(67+i*2)+R);
    row.getCell(1).value=r.date;K.forEach((k,i)=>{const v=r.v[k]||['',''];row.getCell(2+i*2).value=v[0];row.getCell(3+i*2).value=v[1]});
    row.getCell(nc).value={formula:cells.join('+')};row.getCell(nc+1).value=r.ntbc||'';row.getCell(nc+2).value=r.left||'';
    for(let c=1;c<nc+3;c++){const x=row.getCell(c);x.border=BOX;x.alignment=c===nc+1?{vertical:'middle',wrapText:true}:CEN}
    row.getCell(1).font=row.getCell(nc).font={bold:true};
    if(r.date===now.date)for(let c=1;c<nc+3;c++){row.getCell(c).fill=FILL('FFF8E1');row.getCell(c).font={bold:true}}});
  // 종류별 mice
  LINES().forEach(L=>{const ws=wb.addWorksheet(L==='FAH'?'Fah mice':`${L} mice`,{views:[{state:'frozen',ySplit:1,xSplit:1}]});
    ws.columns=[['Cage Number',12],['D.O.B',12],['Male',8],['Female',8],['Total per cage',9],['Parents',9],['Information',70],['Mating 여부',10],['Plan',75]].map(([header,width])=>({header,width}));
    head(ws,[1],lc(L));ws.getRow(1).height=30;
    legRows(L).forEach(x=>{const r=ws.addRow([x.no,x.dob?new Date(Date.UTC(...x.dob.split('-').map((v,i)=>+v-(i===1)))):'',x.m,x.f,x.t,x.par,rt(x.info),x.mate,rt(x.plan)]);
      const zero=!x.t;
      r.eachCell({includeEmpty:true},(c,i)=>{c.border=BOX;c.alignment=i===7||i===9?TOP:CEN;if(zero)c.font={color:{argb:'FF'+GR}}});
      r.getCell(2).numFmt='yyyy.mm.dd';
      if(!zero){r.getCell(1).font={bold:true};r.getCell(3).font={bold:true,color:{argb:'FF'+BL}};r.getCell(4).font={bold:true,color:{argb:'FF'+PK}};r.getCell(5).font={bold:true}}
      else r.getCell(1).font={bold:true,color:{argb:'FF'+GR}};
      if(x.mate==='mating'){r.getCell(8).fill=FILL(MATE);r.getCell(8).font={bold:true,color:{argb:'FF'+BL}}}});
    ws.autoFilter={from:'A1',to:'I1'}});
  // 일반
  const G=S.general||[];if(G.length){const ws=wb.addWorksheet('일반 mice',{views:[{state:'frozen',ySplit:1}]});ws.columns=GF.map(([k,l])=>({header:l==='♂'?'Male':l==='♀'?'Female':l,width:k==='memo'?60:k==='m'||k==='f'?8:13}));head(ws,[1],'E6F0E0');
    [...G].sort((a,b)=>(a.owner||'').localeCompare(b.owner||'','ko')).forEach(g=>{const r=ws.addRow(GF.map(([k])=>k==='memo'?[...gNotes(g).reverse().map(n=>n.text),...(g.gone||[]).map(goneS)].join('\n'):g[k]??''));
      r.eachCell({includeEmpty:true},(c,i)=>{c.border=BOX;c.alignment=GF[i-1][0]==='memo'?TOP:CEN});
      GF.forEach(([k],i)=>{if(k==='m')r.getCell(i+1).font={bold:true,color:{argb:'FF'+BL}};if(k==='f')r.getCell(i+1).font={bold:true,color:{argb:'FF'+PK}}})});
    ws.autoFilter={from:{row:1,column:1},to:{row:1,column:GF.length}}}
  const buf=await wb.xlsx.writeBuffer(),u=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})),a=document.createElement('a');
  a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000);
}
function profileForm(first){
  CUR=null;
  const names=[...(S?.roster||['예원','도윤','소윤','한결','유진','재혁','혜민']),'교수님','기타'];
  $('#dT').textContent=first?'닉네임 정하기':'내 정보';
  $('#dB').innerHTML=`<div class="frm"><div class="dim">${esc(AUTH?.email||'')}</div>
   <label>닉네임 <input id="pN" maxlength="12" value="${first?'':esc(ME?.nick||'')}" placeholder="예: 유진"></label>
   <label>당번표 이름 <select id="pR">${names.map(n=>`<option ${n===ME?.name?'selected':''}>${n}</option>`).join('')}</select></label>
   <div class="row"><button class="btn pri" id="pOk">저장</button>${first?'':'<button class="btn" id="pOut">로그아웃</button>'}</div></div>`;
  $('#pOk').onclick=async()=>{const nick=$('#pN').value.trim();if(!nick){$('#pN').focus();return}
    const data={nick,name:$('#pR').value,email:AUTH.email||''};
    if(!first){try{await Store.saveMember(AUTH.uid,data);$('#dlg').close();
      }catch(e){toast('저장 실패')}return}
    // 역할은 서버 규칙이 허용하는 것만 저장됨: 미리 등록된 계정이면 바로 승인, 아니면 승인 대기
    for(const role of ['admin','editor','viewer','pending']){
      try{await Store.saveMember(AUTH.uid,{...data,role});$('#dlg').close();return}catch(e){}
    }
    toast('저장 실패');};
  if(!first)$('#pOut').onclick=()=>Store.logout();
  if(!$('#dlg').open)$('#dlg').showModal();
}

/* ===== 시작 ===== */
const PCOL=[['#ffd3e2','#a3204f'],['#cfe6ff','#1f4f8f'],['#ccf2dc','#1d6b43'],['#e3d8ff','#5a3aa8'],['#fff0b8','#7a5a00'],['#c9f0f0','#1a6a6a'],['#ffdcef','#93307a'],['#e2f7b5','#3f6508']];
function drawPres(){
  const now=Date.now(),me=AUTH?.uid,on=PRES.filter(p=>now-p.t<75000&&p.uid!==me);
  if(me&&ME)on.unshift({uid:me,nick:ME.nick,self:1});
  const h=u=>{let x=5381;for(const ch of u)x=((x*33)^ch.charCodeAt(0))>>>0;return x%PCOL.length};
  const used=new Set(),cmap={};[...on].sort((a,b)=>a.uid.localeCompare(b.uid)).forEach(p=>{let k=h(p.uid);for(let i=0;i<PCOL.length&&used.has(k);i++)k=(k+1)%PCOL.length;used.add(k);cmap[p.uid]=PCOL[k]});
  const col=u=>cmap[u];
  $('#pres').innerHTML=on.map(p=>`<span title="${esc(p.nick)}${p.self?' (나)':' 접속 중'}" style="background:${col(p.uid)[0]};color:${col(p.uid)[1]}${p.self?';outline:2px solid var(--acc-2)':''}">${esc([...p.nick].slice(0,2).join(''))}</span>`).join('');
}
/* 새 버전: 앱을 벗어났을 때 조용히 새로고침 */
let NEWV=0;const VER='20261126045101';
setInterval(async()=>{try{const v=(await (await fetch('version.txt?'+Date.now(),{cache:'no-store'})).text()).trim();
  if(v&&v!==VER&&!NEWV){NEWV=1;if(document.hidden)location.reload()}}catch(e){}},60000);
document.addEventListener('visibilitychange',()=>{if(NEWV&&document.hidden)location.reload()});
/* 화면 표기: 메이팅 → Mating (데이터 값은 그대로) */
const fixMT=n=>{const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT);let t;while(t=w.nextNode())if(t.data.includes('메이팅'))t.data=t.data.replace(/메이팅/g,'Mating')};
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===3){if(n.data.includes('메이팅'))n.data=n.data.replace(/메이팅/g,'Mating')}else if(n.nodeType===1)fixMT(n)}))).observe(document.body,{childList:true,subtree:true});
function show(which){['login','pending','app'].forEach(k=>$('#'+k).hidden=k!==which)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b&&!b.closest('#dB')){e.preventDefault();go(b.dataset.go);scrollTo(0,0)}});
function go(t){tab=t;saveView();$$('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));render()}
$$('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
$$('#tabs button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
$('#dX').onclick=()=>$('#dlg').close();
$('#dlg').addEventListener('close',()=>{CUR=null;const t=$('#toast');if(t.parentNode!==document.body)document.body.appendChild(t)});
$('#meBtn').onclick=()=>profileForm(false);
$('#gIn').onclick=()=>Store.login().catch(e=>toast('로그인 실패'));
$('#pOut2').onclick=()=>Store.logout();
Store.onAuth(u=>{
  if(!u){show('login');return}
  AUTH=u;
  Store.watchMember(u.uid,m=>{
    if(!m){show('login');profileForm(true);return}
    ME={uid:u.uid,...m};
    if(ME.role==='pending'){show('pending');$('#pendMsg').textContent=`${ME.nick} · 유진에게 카톡으로 알려주면 승인해줄 거예요`;return}
    show('app');
    if(!started){started=true;Store.watchData();Store.presence()}
    render();
  });
});
