const PCOL=['#e0795f','#3f9a72','#5b7fd6','#9a62d8','#d4507f','#2c9c8f','#c27a3c','#6f8a2c'];
function drawPres(){
  const now=Date.now(),me=AUTH?.uid,on=PRES.filter(p=>now-p.t<75000&&p.uid!==me);
  if(me&&ME)on.unshift({uid:me,nick:ME.nick,self:1});
  const h=u=>{let x=5381;for(const ch of u)x=((x*33)^ch.charCodeAt(0))>>>0;return x%PCOL.length};
  const used=new Set(),cmap={};[...on].sort((a,b)=>a.uid.localeCompare(b.uid)).forEach(p=>{let k=h(p.uid);for(let i=0;i<PCOL.length&&used.has(k);i++)k=(k+1)%PCOL.length;used.add(k);cmap[p.uid]=PCOL[k]});
  const col=u=>cmap[u];
  $('#pres').innerHTML=on.map(p=>`<span title="${esc(p.nick)}${p.self?' (나)':' 접속 중'}" style="background:${col(p.uid)}${p.self?';outline:2px solid var(--peach-2)':''}">${esc([...p.nick].slice(0,2).join(''))}</span>`).join('');
}

  if(!u){show('login');return}
  AUTH=u;
  Store.watchMember(u.uid,m=>{
    if(!m){show('login');profileForm(true);return}
    ME={uid:u.uid,...m};
    if(ME.role==='pending'){show('pending');$('#pendMsg').textContent=`${ME.nick} · 유진에게 카톡으로 알려주면 승인해줄 거예요`;return}
    show('app');
    if(!started){started=true;Store.watchData();Store.presence()}
    render();
  });
});
</script>
</body>
</html>
